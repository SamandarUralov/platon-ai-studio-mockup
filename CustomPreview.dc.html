<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#17182a;box-sizing:border-box">
<sc-if value="{{ p.pMissing }}" hint-placeholder-val="{{ false }}"><div style="padding:16px;border-radius:12px;border:1px dashed #f1c4bf;background:#fff8f7;color:#b42318;font-size:12.5px;display:flex;align-items:center;gap:8px"><i class="icon-triangle-alert" style="font-size:14px"></i>This component no longer exists in the sandbox.</div></sc-if>
<sc-if value="{{ p.pBuild }}" hint-placeholder-val="{{ false }}">
  <div style="padding:18px;border-radius:12px;background:#fff;border:1px dashed #c7ccff;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:#3f4bd8"><i class="icon-loader-circle" style="font-size:14px"></i>{{ p.buildText }}</div>
    <div style="height:12px;width:40%;border-radius:6px;background:#eceef8"></div>
    <div style="height:10px;width:85%;border-radius:6px;background:#f1f2f8"></div>
    <div style="height:10px;width:70%;border-radius:6px;background:#f1f2f8"></div>
  </div>
</sc-if>
<sc-if value="{{ p.pTimeline }}" hint-placeholder-val="{{ false }}">
  <section style="padding:{{ p.tPad }};border-radius:12px;background:#fff;border:1px solid #ececf2">
    <header style="display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:{{ p.tGap }}"><h3 style="margin:0;font-size:16px;font-weight:800;letter-spacing:-.01em">{{ p.title }}</h3><sc-if value="{{ p.showPct }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;font-weight:800;color:{{ p.acc }}">{{ p.pct }}</span></sc-if></header>
    <ol style="margin:0;padding:0;list-style:none;display:flex;flex-direction:column">
      <sc-for list="{{ p.steps }}" as="s" hint-placeholder-count="4"><li style="display:flex;gap:12px"><div style="display:flex;flex-direction:column;align-items:center;flex:none;width:10px"><span style="width:10px;height:10px;border-radius:50%;background:{{ s.dot }};margin-top:4px;flex:none"></span><sc-if value="{{ s.line }}" hint-placeholder-val="{{ true }}"><span style="width:2px;flex:1;background:{{ s.lineBg }}"></span></sc-if></div><div style="padding-bottom:{{ p.tGap }};min-width:0"><div style="font-size:13.5px;font-weight:700;color:{{ s.fg }}">{{ s.label }}</div><div style="font-size:12px;color:#8a8c9c">{{ s.at }}</div></div></li></sc-for>
    </ol>
  </section>
</sc-if>
<sc-if value="{{ p.pSig }}" hint-placeholder-val="{{ false }}">
  <div style="padding:16px;border-radius:12px;background:#fff;border:1px solid #ececf2;display:flex;flex-direction:column;gap:8px;opacity:{{ p.sigOp }}">
    <div style="font-size:13px;font-weight:700">{{ p.sigLabel }}</div>
    <div style="height:120px;border:1px dashed #c9cad6;border-radius:8px;display:grid;place-items:center;color:{{ p.pen }};font-size:26px;font-style:italic;font-family:'Brush Script MT','Segoe Script',cursive">{{ p.sigText }}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="font-size:11.5px;color:#8a8c9c">{{ p.sigHint }}</span><button style="height:28px;padding:0 10px;border-radius:7px;border:1px solid #e1e1ea;background:#fff;font-size:12px;font-weight:600;font-family:inherit;color:#17182a">Clear</button></div>
  </div>
</sc-if>
<sc-if value="{{ p.pRating }}" hint-placeholder-val="{{ false }}">
  <div style="padding:14px 16px;border-radius:12px;background:#fff;border:1px solid #ececf2;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="display:flex;gap:4px"><sc-for list="{{ p.stars }}" as="s" hint-placeholder-count="5"><button onClick="{{ s.go }}" style="border:none;background:none;padding:0;font-size:24px;line-height:1;color:{{ s.fg }};cursor:{{ s.cur }}">★</button></sc-for></div>
    <span style="font-size:12.5px;color:#6b6d80;font-weight:600">{{ p.rText }}</span>
  </div>
</sc-if>
<sc-if value="{{ p.pGeneric }}" hint-placeholder-val="{{ false }}">
  <div style="padding:{{ p.gPad }};border-radius:12px;background:#fff;border:1px solid #ececf2;border-top:3px solid {{ p.acc }}">
    <h3 style="margin:0;font-size:15px;font-weight:800">{{ p.title }}</h3>
    <ul style="margin:10px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px"><sc-for list="{{ p.items }}" as="it" hint-placeholder-count="3"><li style="padding:8px 10px;border-radius:8px;background:#f7f7fa;font-size:13px">{{ it.name }}</li></sc-for></ul>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:260},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
